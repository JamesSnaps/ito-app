# The Python suite on every pull request, before anything reaches main.
# main runs it again before publishing the image (docker-publish.yml); that
# used to be the first time a change was tested, so a flaky test was only
# ever found after the merge.
name: Tests

on:
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Run tests
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
          pytest tests -q
