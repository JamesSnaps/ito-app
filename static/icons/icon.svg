<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Game Night's home-screen icon: ito's scale line on one card, Flip 7's
       seven on the other, on the hub's background. Full bleed with the
       drawing inside the central safe zone, so one file serves as both the
       plain and the maskable icon. Rasterised to the PNGs beside it. -->
  <defs>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4f8cff"/>
      <stop offset="0.55" stop-color="#8f7bff"/>
      <stop offset="1" stop-color="#ff7bc2"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f0c875"/>
      <stop offset="1" stop-color="#d9a94e"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="#14161b"/>
  <g transform="translate(256 262) scale(0.86) translate(-256 -262)">
    <g transform="rotate(-14 180 270)">
      <rect x="66" y="136" width="200" height="272" rx="28" fill="#2a2e37" stroke="#3a3f4a" stroke-width="5"/>
      <path d="M86 236 C 102 236, 106 260, 120 260 C 134 260, 136 196, 152 196
               C 168 196, 170 244, 156 247 C 145 250, 140 224, 156 220
               C 172 216, 178 236, 192 236"
            transform="translate(166 272) scale(1.5) translate(-139 -228)"
            fill="none" stroke="url(#line)" stroke-width="9" stroke-linecap="round"/>
    </g>
    <g transform="rotate(9 340 262)">
      <rect x="236" y="124" width="196" height="272" rx="28" fill="url(#gold)"
            stroke="#14161b" stroke-width="8"/>
      <path d="M286 204 H 384 L 326 344" fill="none" stroke="#12241c"
            stroke-width="32" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>
</svg>
