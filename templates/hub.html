{% extends "base.html" %}
{% block title %}{{ app_name }}{% endblock %}
{% block body %}
<div class="wrap">
  <h1>{{ app_name }}</h1>
  <div class="sub">Companion apps for the board games on the shelf.</div>

  <div class="game-list">
    {% for game in games %}
    <a class="game-card" href="{{ url_for(game.id ~ '.landing') }}">
      <div class="name">{{ game.name }}</div>
      <div class="tagline">{{ game.tagline }}</div>
    </a>
    {% endfor %}
  </div>

  <div class="version">v{{ app_version }}</div>

  <div class="section">
    <h2>Joining a game?</h2>
    <a class="btn btn-secondary" href="{{ url_for('join') }}" style="width:100%;">Enter a room code</a>
  </div>
</div>
{% endblock %}
