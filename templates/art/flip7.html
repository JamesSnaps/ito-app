{# Three cards mid-fan, the middle one flipped up to a 7 — the moment the
   game is named after. The outer two are splayed far enough that their pips
   stay readable beside the hero card rather than tucked behind it. #}
<svg class="game-art" viewBox="0 0 240 140" aria-hidden="true">
  <g transform="rotate(-18 66 78)">
    <rect class="art-plate art-plate-quiet" x="18" y="32" width="70" height="94" rx="10"/>
    <text class="art-pip" x="46" y="90" text-anchor="middle">12</text>
  </g>
  <g transform="rotate(18 174 78)">
    <rect class="art-plate art-plate-quiet" x="152" y="32" width="70" height="94" rx="10"/>
    <text class="art-pip" x="194" y="90" text-anchor="middle">x2</text>
  </g>
  <g>
    <rect class="art-plate art-plate-hero" x="84" y="12" width="74" height="102" rx="11"/>
    <text class="art-pip art-pip-hero" x="121" y="82" text-anchor="middle">7</text>
  </g>
</svg>
