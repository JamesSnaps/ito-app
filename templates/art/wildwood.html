   wood the game is named after. #}

  <g transform="rotate(-24 70 120)">
    <rect class="art-plate art-plate-quiet" x="34" y="34" width="64" height="88" rx="10"/>
    <text class="art-pip" x="62" y="90" text-anchor="middle">7</text>
  </g>
  <g transform="rotate(-8 100 120)">
    <rect class="art-plate art-plate-quiet" x="66" y="26" width="64" height="88" rx="10"/>

    <path class="art-stroke" d="M164 86L188 62" style="stroke: var(--muted-2); stroke-width: 5"/>

  <g transform="rotate(9 140 120)">
